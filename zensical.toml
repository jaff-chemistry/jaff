[project.repository]
url = "https://github.com/jaff-chemistry/jaff"
name = "jaff-chemistry/jaff"
edit_uri = "edit/main/docs/"

# -----------------------------------------------------------------------------
# THEME CONFIGURATION
# -----------------------------------------------------------------------------
[project.theme]
variant = "modern"  # This enables the floating cards + dot matrix background
custom_dir = "overrides"  # hosts vendored phosphor icons in overrides/.icons/phosphor
logo = "assets/brand/logo.webp"
icon.repo = "fontawesome/brands/github"
favicon = "assets/brand/favicon.ico"
font.text = "Inter"
font.code = "JetBrains Mono"

[project.theme.features]
"navigation.tabs" = true
"navigation.indexes" = true
"navigation.instant" = true
"navigation.instant.prefetch" = true
"navigation.instant.progress" = true
"navigation.instant.preview" = true
"navigation.tracking" = true
"navigation.path" = true
"navigation.top" = true
"navigation.footer" = true
"content.action.edit" = true
"content.action.view" = true
"toc.follow" = true
"search.suggest" = true
"search.highlight" = true
"search.share" = true
"content.code.copy" = true
"content.code.annotate" = true
"content.code.select" = true
"content.tabs.link" = true
"content.tooltips" = true

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "orange"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon.tag]
"intro" = "material/hand-wave"
"guide" = "material/book-open-variant"
"template" = "material/layers-outline"
"codegen" = "material/xml"
"api" = "material/api"
"network" = "material/lan"
"reaction" = "material/flask"
"species" = "material/dna"
"elements" = "material/periodic-table"
"dev" = "material/hammer-wrench"
"license" = "material/scale-balance"
"types" = "material/format-list-bulleted-type"
"install" = "material/download-box-outline"
"test" = "material/flask-outline"

[project.extra.tags]
Introduction = "intro"
User-guide = "guide"
Template = "template"
Code-generation = "codegen"
Api = "api"
Network = "network"
Reaction = "reaction"
Species = "species"
Elements = "elements"
Development = "dev"
License = "license"
Types = "types"
Installation = "install"
Testing = "test"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jaff-chemistry/jaff"

[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options = { custom_icons = ["overrides/.icons"] }

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
