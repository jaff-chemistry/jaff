# ABOUTME: GitHub Actions workflow for running pytest on push and pull requests
# ABOUTME: Tests on multiple Python versions and operating systems

name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ['3.11', '3.12', '3.13']

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Install dependencies (locked)
              run: |
                  uv sync --locked --extra dev --python ${{ matrix.python-version }}

            # pooch verifies downloads against the registry served next to the data,
            # so key the cache on that registry: it changes exactly when the data do.
            - name: Fetch data registry
              shell: bash
              run: |
                  curl -fsSL https://www.mso.anu.edu.au/~anishs/registry.txt -o .ci-data-registry.txt

            - name: Cache downloaded xsec/shielding data
              uses: actions/cache@v4
              with:
                  path: |
                      src/jaff/data
                      !src/jaff/data/registry.txt
                  key: jaff-data-v3-${{ matrix.os }}-${{ hashFiles('.ci-data-registry.txt') }}
                  restore-keys: |
                      jaff-data-v3-${{ matrix.os }}-

            - name: Run tests with pytest
              run: |
                  uv run pytest tests/ -v --cov=jaff --cov-report=xml --cov-report=term

            - name: Upload coverage to Codecov
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
              uses: codecov/codecov-action@v4
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  file: ./coverage.xml
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false
