# ABOUTME: GitHub Action workflow to run and test all Python notebooks in examples/
# ABOUTME: Ensures notebooks execute without errors on every push and pull request

name: Test Notebooks

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    test-notebooks:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.11', '3.12', '3.13']

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              run: |
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: |
                  uv pip install --system -e .
                  uv pip install --system nbconvert ipykernel matplotlib scipy

            # pooch verifies downloads against the registry served next to the data,
            # so key the cache on that registry: it changes exactly when the data do.
            - name: Fetch data registry
              run: |
                  curl -fsSL https://www.mso.anu.edu.au/~anishs/registry.txt -o .ci-data-registry.txt

            - name: Cache downloaded xsec/shielding data
              uses: actions/cache@v4
              with:
                  path: |
                      src/jaff/data
                      !src/jaff/data/registry.txt
                  key: jaff-data-v3-${{ hashFiles('.ci-data-registry.txt') }}
                  restore-keys: |
                      jaff-data-v3-

            - name: Find and run notebooks
              run: |
                  # Find all .ipynb files in examples/
                  notebooks=$(find examples -name "*.ipynb" -type f)

                  # Exit if no notebooks found
                  if [ -z "$notebooks" ]; then
                    echo "No notebooks found in examples/"
                    exit 0
                  fi

                  # Run each notebook and capture partial results
                  output_dir="notebook-artifacts"
                  mkdir -p "$output_dir"
                  errors=0
                  for notebook in $notebooks; do
                    echo "Running notebook: $notebook"
                    rel_path="${notebook#./}"
                    exec_path="$output_dir/${rel_path%.ipynb}.executed.ipynb"
                    mkdir -p "$(dirname "$exec_path")"
                    jupyter nbconvert \
                      --to notebook \
                      --execute \
                      --output "$(basename "$exec_path")" \
                      --output-dir "$(dirname "$exec_path")" \
                      --debug \
                      --ExecutePreprocessor.timeout=600 \
                      --ExecutePreprocessor.startup_timeout=120 \
                      --ExecutePreprocessor.allow_errors=True \
                      "$notebook" || exit 1
                    python .github/scripts/check_notebook_errors.py "$exec_path" || errors=1
                  done

                  if [ "$errors" -ne 0 ]; then
                    echo "One or more notebooks had errors (see artifacts for partial output)."
                    exit 1
                  fi

                  echo "All notebooks executed successfully!"

            - name: Upload executed notebooks
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: executed-notebooks-${{ matrix.python-version }}
                  path: notebook-artifacts
                  if-no-files-found: ignore
